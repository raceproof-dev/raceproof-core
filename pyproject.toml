[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "raceproof"
dynamic = ["version"]
description = "Reproduce race conditions in 3-D Secure payment flows, many times, and prove the fixes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["3-D Secure", "3DS2", "race condition", "payments", "payment gateway", "testing", "idempotency",
            "webhooks", "PSP", "Adyen", "Stripe"]
dependencies = ["requests>=2.28", "pyyaml>=6", "starlette>=0.27", "uvicorn>=0.22"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://raceproof.dev"
Source = "https://github.com/raceproof-dev/raceproof-core"
Issues = "https://github.com/raceproof-dev/raceproof-core/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
raceproof = "raceproof.cli:main"

[project.entry-points."raceproof.psps"]
demo = "raceproof.demo"

[tool.hatch.version]
path = "src/raceproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/raceproof"]
